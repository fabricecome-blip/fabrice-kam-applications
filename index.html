<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabrice Côme-Portillo — KAM Applications</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
h1{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#888;margin-bottom:48px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;max-width:800px}
.card{background:#fff;border:1.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:24px;text-decoration:none;color:#1a1a1a;transition:all 0.2s}
.card:hover{border-color:#a50034;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.card-tag{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#a50034;margin-bottom:8px}
.card-name{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.card-role{font-family:'Space Mono',monospace;font-size:9px;color:#888;letter-spacing:0.06em;text-transform:uppercase}
</style>
</head>
<body>
<h1>Fabrice Côme-Portillo</h1>
<div class="sub">Key Account Manager · Applications 2026</div>
<div class="grid" id="grid"></div>
<script>
var apps=[
  {slug:"nothing",company:"Nothing",role:"KAM France",color:"#ff0000"},
  {slug:"lg-electronics",company:"LG Electronics",role:"Responsable Grands Comptes TV/Audio",color:"#a50034"}
];
var g=document.getElementById("grid");
apps.forEach(function(a){
  var c=document.createElement("a");
  c.href="/"+a.slug+"/";
  c.className="card";
  c.innerHTML='<div class="card-tag" style="color:'+a.color+'">Application en cours</div><div class="card-name">'+a.company+'</div><div class="card-role">'+a.role+'</div>';
  g.appendChild(c);
});
</script>
</body>
</html>
